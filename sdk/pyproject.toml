[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-catalog-sdk"
dynamic = ["version"]
description = "Python SDK and CLI for Argus Catalog (model registry, AI agent manifests)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.scripts]
argus-model = "argus_catalog_sdk.cli:main"
argus-catalog = "argus_catalog_sdk.cli:main"

[tool.setuptools.dynamic]
version = { attr = "argus_catalog_sdk.__version__" }  # 버전은 src/argus_catalog_sdk/__init__.py 한 곳에만

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
