# Argus Catalog AI Service — 표준 라이브러리만 사용하므로 런타임 의존성이 없다.
[project]
name = "argus-catalog-ai-service"
version = "0.5.0"
description = "Argus Catalog AI 서비스 — AI 어시스턴트 서버와 LLM 기반 메타데이터 생성 (독립 실행)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
argus-catalog-ai = "argus_catalog_ai.cli:main"
# 이전 이름 (deprecated — 다음 MINOR 에서 제거)
argus-agent = "argus_catalog_ai.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["argus_catalog_ai"]
